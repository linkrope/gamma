name: Build & Test Gamma

on:
  workflow_call:
    inputs:
      compiler_version:
        type: string
        required: true
      build_type:
        type: string
        required: false
        default: "debug"

jobs:
  build:
    name: build & test Gamma
    strategy:
      matrix:
        os: [Windows, Linux, MacOS]
        include:
          - os: Windows
            runner: windows-latest
            upload-path: ./gamma.exe
            upload-name: gamma.windows-amd64.exe
          - os: Linux
            runner: ubuntu-latest
            upload-path: ./gamma
            upload-name: gamma.linux-amd64
          - os: MacOS
            runner: macos-15
            upload-path: ./gamma
            upload-name: gamma.macos-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install LDC compiler for building gamma
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ inputs.compiler_version }}

      - name: Build & run tests
        run: |
          dub build --build=${{inputs.build_type}}
          dub test --build=unittest --config=example -- --threads 1

      - name: Verify Apple-silicon executable
        if: matrix.os == 'MacOS'
        run: |
          test "$(uname -m)" = arm64
          test "$(lipo -archs ./gamma)" = arm64

      - name: Upload executables to workflow run page
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.upload-name }}
          path: ${{ matrix.upload-path }}
          retention-days: 1
