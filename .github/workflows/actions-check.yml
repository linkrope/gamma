name: Check Gamma Project

on:
  workflow_call:
    inputs:
      compiler_version:
        type: string
        required: true

jobs:
  check:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Install D compiler
      uses: dlang-community/setup-dlang@v2
      with:
        compiler: ${{ inputs.compiler_version }}

    - run: |
        dub fetch dscanner@0.15.2
        dub fetch depend@0.4.0

    - name: Check style
      run: |
        dub run dscanner -- --styleCheck src test

    - name: Check dependency model
      run: |
        dub run depend -- \
          --check doc/dependencies.puml \
          $(rg --files src include unittest -g '*.d' | sort)

    - name: Check formatting
      run: dub run --single tool/format.d -- --check

    - name: Check cognitive complexity
      run: |
        git clone --depth 1 --branch v1.9.0 \
          https://github.com/funkwerk-mobility/cogito.git "$RUNNER_TEMP/cogito"
        pushd "$RUNNER_TEMP/cogito"
        dub build --build=release --config=executable
        popd
        "$RUNNER_TEMP/cogito/build/cogito" \
          --threshold 15 \
          --module-threshold 100 \
          --format flat \
          --config cogito.conf \
          $(rg --files src include test unittest -g '*.d' | sort)
