name: Check Gamma Project

on:
  workflow_call:
    inputs:
      compiler_version:
        type: string
        required: true

jobs:
  check:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install D compiler
      uses: dlang-community/setup-dlang@v2
      with:
        compiler: ${{ inputs.compiler_version }}

    - run: |
        dub fetch dscanner@0.15.2
        dub fetch depend@0.4.0

    - name: Check style
      run: |
        dub run dscanner -- --styleCheck src test

    - name: Check dependency model
      run: |
        dub run depend -- \
          --check doc/dependencies.puml \
          $(rg --files src include unittest -g '*.d' | sort)

    - name: Check formatting
      run: |
        # dfmt edits in place when it receives more than one path;
        # checking the resulting diff gives CI a useful patch when formatting is required.
        rg --files src include test unittest -g '*.d' |
          xargs dub run dfmt@~master --
        git diff --exit-code -- '*.d'
