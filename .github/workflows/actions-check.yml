name: Check Gamma Project

on:
  workflow_call:
    inputs:
      compiler_version:
        type: string
        required: true

jobs:
  check:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Install D compiler
      uses: dlang-community/setup-dlang@v2
      with:
        compiler: ${{ inputs.compiler_version }}

    - name: Check style
      run: dub run --single tool/dscanner.d

    - name: Check formatting
      run: dub run --single tool/format.d -- --check

    - name: Check dependencies
      run: dub run --single tool/depend.d

    - name: Check cognitive complexity
      run: dub run --single tool/cogito.d
