name: Check Gamma Project

on:
  workflow_call:
    inputs:
      compiler_version:
        type: string
        required: true

jobs:
  check:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Install D compiler
      uses: dlang-community/setup-dlang@v2
      with:
        compiler: ${{ inputs.compiler_version }}

    - run: |
        dub fetch dscanner@0.15.2
        dub fetch depend@0.4.0

    - name: Check style
      run: |
        dub run dscanner -- --styleCheck src test

    - name: Check dependency model
      run: |
        dub run depend -- \
          --check doc/dependencies.puml \
          $(find src include unittest -type f -name '*.d' | sort)

    - name: Check formatting
      run: dub run --single tool/format.d -- --check
