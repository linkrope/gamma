name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  build:
    name: build & test
    uses: ./.github/workflows/actions-build.yml
    with:
      compiler_version: ldc-1.43.0
      build_type: release-asserts

  upload:
    uses: ./.github/workflows/actions-upload.yml
    secrets: inherit
    needs: build
